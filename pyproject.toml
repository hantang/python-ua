[project]
name = "forge-useragent"
version = "3.0.0"
license = "Apache-2.0"
description = "Up-to-date simple user-agent faker with real world database"
readme = "README.md"
keywords = [
  "agent",
  "user-agent",
  "useragent",
  "forge",
  "fake",
  "forge-useragent",
  "fake-useragent",
]
authors = [
  { name = "Melroy van den Berg", email = "melroy@melroy.org" },
  { name = "Victor Kovtun", email = "hellysmile@gmail.com" },
  { name = "hantang" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
converter = [
  # "requests>=2.32.4",
  "ua-parser[regex]>=1.0.2",
]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.13",
  "validate-pyproject>=0.24.1",
]

[tool.uv.build-backend]
module-name = "fake_useragent"

[tool.ruff]
target-version = "py310"
line-length = 142
