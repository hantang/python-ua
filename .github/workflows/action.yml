name: Test fake-useragent

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    runs-on: ubuntu-latest # [macos-latest, windows-latest]
    strategy:
      # fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.10"]

    name: Python ${{ matrix.python-version }} Test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff format check
        run: uvx ruff format --check src tests

      - name: Ruff lint
        run: uvx ruff check src tests

      - name: Type check
        run: uvx mypy src

      - name: Validate package metadata
        run: uvx --with tomli validate-pyproject pyproject.toml

      - name: Run tests
        run: uv run pytest --cov=src --cov-report=html

      - name: Upload code coverage HTML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
